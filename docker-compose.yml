services:
  db:
    container_name: challenge_db
    build: ./postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: ${PGDATA}
    volumes:
       - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
  api:
    container_name: challenge_api
    build:
      context: ./api
      target: production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
    ports:
      - "3000:3000"
  ui:
    container_name: challenge_ui
    build:
      context: ./ui
      target: production
      args:
        REACT_APP_API_URL: http://localhost:3000
    environment:
      REACT_APP_API_URL: http://localhost:3000
    ports:
      - "3001:80"
  api-dev:
    profiles: ["dev"]
    build:
      context: ./api
      target: development
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - api-dev-node-modules:/app/node_modules
    depends_on:
      - db
  ui-dev:
    profiles: ["dev"]
    build:
      context: ./ui
      target: development
    environment:
      REACT_APP_API_URL: http://localhost:3000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3001:3001"
    volumes:
      - ./ui:/app
      - ui-dev-node-modules:/app/node_modules
  api-test:
    profiles: ["test"]
    build:
      context: ./api
      target: test
  ui-test:
    profiles: ["test"]
    build:
      context: ./ui
      target: test
    environment:
      REACT_APP_API_URL: http://localhost:3000
volumes:
    db:
    api-dev-node-modules:
    ui-dev-node-modules:
